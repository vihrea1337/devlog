name: CI

# Запускаем проверки на каждый пуш в main и на каждый pull request.
# Тесты бэкенда идут на встроенной базе H2 — реальный Postgres/Docker в CI не нужен.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Бэкенд — тесты и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Прогнать тесты и собрать fat-jar
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew test buildFatJar --no-daemon
